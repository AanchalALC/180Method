name: Instagram sync

# Refreshes Instagram every three hours and commits changes to src/data/instagram.js
# and public/instagram/. This is a static-site snapshot, not a live feed:
# GitHub may delay scheduled runs, and Vercel must deploy each changed commit.
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

concurrency:
  group: instagram-sync
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      IG_PAT_CONFIGURED: ${{ secrets.IG_PAT != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Sync Instagram feed
        id: sync
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node scripts/sync-instagram.mjs

      # Option A — automatic. Requires a fine-grained PAT (`IG_PAT`) scoped to
      # this repo with Actions: write. GITHUB_TOKEN cannot write secrets, so
      # this step is skipped entirely when IG_PAT isn't set.
      - name: Persist refreshed token to secrets
        id: persist_token
        if: steps.sync.outputs.new_token != '' && env.IG_PAT_CONFIGURED == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.IG_PAT }}
          NEW_IG_ACCESS_TOKEN: ${{ steps.sync.outputs.new_token }}
        run: printf '%s' "$NEW_IG_ACCESS_TOKEN" | gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY"

      - name: Report token persistence failure
        if: steps.persist_token.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          open_issues=$(gh issue list --state open --search "Instagram token persistence failed in:title" --json number --jq 'length')
          if [ "$open_issues" = "0" ]; then
            gh issue create \
              --title "Instagram token persistence failed" \
              --body "The Instagram sync refreshed the feed, but GitHub rejected the IG_PAT credential while saving the new IG_ACCESS_TOKEN. Check that IG_PAT is valid, has access to this repository, and has Actions read/write permission. Update the IG_PAT Actions secret; otherwise token rotation will not persist and future feed syncs may stop when IG_ACCESS_TOKEN expires." \
              --repo "$GITHUB_REPOSITORY"
          fi

      # Option B — fallback, only when there's no PAT to do this automatically.
      # An already-expired token cannot be refreshed at all — the account has
      # to be reconnected from the Meta App Dashboard — so this needs a human
      # before that happens, not after.
      - name: Open low-expiry issue
        if: steps.sync.outputs.days_remaining != '' && fromJSON(steps.sync.outputs.days_remaining) < 14 && env.IG_PAT_CONFIGURED != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Instagram token expires in ${{ steps.sync.outputs.days_remaining }} days" \
            --body "scripts/sync-instagram.mjs reports the IG_ACCESS_TOKEN secret expires in ${{ steps.sync.outputs.days_remaining }} day(s), and no IG_PAT secret is configured to refresh it automatically. Generate a new token (Meta App Dashboard → Instagram → API setup with Instagram business login → Generate token) and update the IG_ACCESS_TOKEN secret before it expires. An already-expired token cannot be refreshed — the account must be reconnected from the App Dashboard instead." \
            --repo ${{ github.repository }}

      - name: Commit synced feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/instagram src/data/instagram.js src/data/instagram-profile.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync instagram feed"
            git push
          fi
